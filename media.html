<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Karma check out photos and video</title>
<!-- Karma check out media page. Step 1 (K999 trial) 26 Nov 2026 19:33; step 2 and the speed fix 26 Nov 2026 22:30 (all 8 protocol sections,
     zones and named spots, the protocol notes, slate screen, pickup timing, one call per photo). Staff only: Google sign in, then the Staff tab check in the API.
     Address: media.html?van=999   Add &mock=1 to see the layout with nothing sent. -->
<style>
  :root { --btn:#dd2f2e; --red:#ef4138; --grey:#545454; --help:#666666; --line:#e3e3e3; --soft:#f5f5f5; --ok:#1b7f3b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#222; background:#fff; }
  header { background:var(--btn); color:#fff; padding:14px 16px; font-weight:700; font-size:18px; }
  main { padding:12px 16px 40px; max-width:560px; margin:0 auto; }
  .who { color:var(--help); font-size:14px; margin:4px 0 12px; }
  .who a { color:var(--help); }
  .tot { font-size:16px; font-weight:700; margin:6px 0; }
  .time { border-radius:12px; padding:10px 12px; margin:8px 0; font-size:14px; background:var(--soft); }
  .time.bad { border:2px solid var(--btn); background:#fff; color:var(--btn); font-weight:600; }
  .sec { border:3px solid var(--btn); border-radius:14px; padding:12px 14px; margin:14px 0; }
  .sec.done { background:var(--btn); color:#fff; }
  .sec h2 { margin:0 0 4px; font-size:17px; text-transform:uppercase; }
  .sec .cnt { font-size:14px; }
  .sec details { font-size:13px; margin-top:6px; } .sec summary { cursor:pointer; font-weight:600; }
  .part { border-top:1px solid rgba(0,0,0,.12); margin-top:10px; padding-top:8px; }
  .sec.done .part { border-color:rgba(255,255,255,.4); }
  .part b { font-size:15px; }
  .btn { display:block; width:100%; padding:15px; margin:10px 0 0; border-radius:12px; border:1.5px solid var(--grey); background:#fff;
         font-size:16px; font-weight:600; color:#222; text-align:center; }
  .btn.primary { background:var(--btn); border-color:var(--btn); color:#fff; }
  .btn.small { padding:11px; font-size:15px; margin-top:6px; }
  .sec.done .btn { border-color:#fff; }
  .row { display:flex; gap:8px; } .row .btn { flex:1; }
  .prog { margin:10px 0 0; font-size:14px; }
  .bar { height:10px; background:var(--soft); border-radius:6px; overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; width:0; background:var(--ok); }
  .sec.done .bar { background:rgba(255,255,255,.35); } .sec.done .bar i { background:#fff; }
  .err { color:var(--btn); font-weight:600; min-height:1em; margin:8px 0; }
  .list { font-size:13px; color:var(--help); margin-top:16px; }
  .list div { padding:6px 0; border-bottom:1px solid var(--line); }
  .note { font-size:13px; color:var(--help); }
  #slate { position:fixed; inset:0; background:#000; color:#fff; display:none; flex-direction:column; justify-content:center; align-items:center; text-align:center; z-index:9; }
  #slate .v { font-size:110px; font-weight:800; line-height:1; } #slate .l { font-size:30px; margin:10px 0; } #slate .x { font-size:16px; margin-top:30px; color:#bbb; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<header id="hd">Check out photos and video</header>
<main>
  <div id="who" class="who"></div>
  <div id="err" class="err"></div>
  <div id="body"></div>
  <div id="list" class="list"></div>
  <p class="note">Trial page on test vans. Photos are made smaller on the phone and go up one at a time in a single step. Videos upload at full quality in 4 MB pieces; if the signal drops, tap Carry on.</p>
</main>
<div id="slate" onclick="this.style.display='none'"></div>
<input type="file" id="fCam" accept="image/*" capture="environment">
<input type="file" id="fRoll" accept="image/*" multiple>
<input type="file" id="fVidCam" accept="video/*" capture="environment">
<input type="file" id="fVidRoll" accept="video/*">
<script>
/* ONE SETTING: the same API address as index.html (var API_URL there). */
var API_URL = 'https://script.google.com/macros/s/AKfycbysIXKLf0PTr4VguvCpen_KmRKPKIPKbN1GW_LjNn8-g2lHuc_Cw3TGACT7uY5FhEs5/exec';
var STAFF_CLIENT_ID = '484799108958-2lnlt0dvjaum83hf4am60aheugtgbeoh.apps.googleusercontent.com';
var Q = new URLSearchParams(location.search), VAN = (Q.get('van') || '').replace(/\D/g, ''), MOCK = Q.get('mock') === '1';
var PHOTO_MAX_EDGE = 2048, PHOTO_QUALITY = 0.82;
var st = { tok: '', info: null, busy: false };
function $(i) { return document.getElementById(i); }
function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function mb(n) { return (n / 1048576).toFixed(n < 10485760 ? 2 : 1) + ' MB'; }
function secs(ms) { return (ms / 1000).toFixed(1) + ' s'; }
function device() { return (navigator.userAgent || '').slice(0, 120); }
function err(m) { $('err').textContent = m || ''; if (m) try { $('err').scrollIntoView({ block: 'center' }); } catch (e) {} }
function key(s) { return String(s).replace(/\W+/g, '_'); }

/* ---------- API (same contract as index.html: text/plain POST, no cookies) ---------- */
function api(fn, args) {
  if (MOCK) return mockApi(fn, args);
  return fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }),
    credentials: 'omit', redirect: 'follow' }).then(function (r) { return r.text(); }).then(function (t) {
    var j; try { j = JSON.parse(t); } catch (e) { throw new Error('The server did not answer properly.'); }
    if (j && j.ok) return j.result;
    var m = (j && j.error) || 'The server could not do that.';
    if (/sign in again/i.test(m)) { try { sessionStorage.removeItem('kstafftok'); } catch (x) {} st.tok = ''; signIn(); }
    throw new Error(m);
  });
}

/* ---------- staff sign in (same token store as the VCR staff page) ---------- */
function getTok() { try { var o = JSON.parse(sessionStorage.getItem('kstafftok') || 'null'); if (o && o.exp > Date.now()) return o.t; } catch (e) {} return ''; }
function saveTok(t) {
  var exp = Date.now() + 50 * 60e3;
  try { var p = JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); if (p.exp) exp = p.exp * 1000 - 60e3; } catch (e) {}
  try { sessionStorage.setItem('kstafftok', JSON.stringify({ t: t, exp: exp })); } catch (e) {}
  st.tok = t;
}
function signIn() {
  var b = $('body'); b.innerHTML = ''; $('list').innerHTML = ''; $('who').textContent = '';
  b.appendChild(el('p', '', 'Sign in with the Google account you use for Karma Ops.'));
  var host = el('div'); b.appendChild(host);
  if (MOCK) { var tb = el('button', 'btn primary', 'Test sign in'); tb.onclick = function () { saveTok('x.eyJleHAiOjk5OTk5OTk5OTl9.x'); load(); }; b.appendChild(tb); return; }
  var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = function () {
    google.accounts.id.initialize({ client_id: STAFF_CLIENT_ID, callback: function (r) { saveTok(r.credential); load(); } });
    google.accounts.id.renderButton(host, { theme: 'outline', size: 'large', text: 'signin_with', width: 280 });
  };
  s.onerror = function () { err('Google sign in did not load. Check the signal and try again.'); };
  document.head.appendChild(s);
}
function load() {
  err('');
  api('staffMediaInfo', [st.tok, VAN]).then(function (i) { st.info = i; render(); }, function (e) { err(e.message); });
}

/* ---------- page ---------- */
function render() {
  var i = st.info, b = $('body'); b.innerHTML = '';
  $('hd').textContent = 'K' + VAN + ' check out photos and video';
  var w = $('who'); w.textContent = 'Signed in: ' + i.who.name + ' (' + i.who.role + '). ';
  var so = el('a', '', 'Sign out'); so.href = '#'; so.onclick = function (e) { e.preventDefault(); try { sessionStorage.removeItem('kstafftok'); } catch (x) {} st.tok = ''; signIn(); }; w.appendChild(so);
  if (!i.open) { b.appendChild(el('p', '', 'This page is in a trial on test vans only. Use Karma Ops for K' + VAN + '.')); return; }
  b.appendChild(el('div', 'tot', (i.doneCount || 0) + ' of ' + (i.total || 8) + ' sections done'));
  var p = i.pickup || {}, tm = el('div', 'time' + (p.found && !p.ok ? ' bad' : ''), p.text || ''); b.appendChild(tm);
  var sl = el('button', 'btn', 'Slate for the video (van, date, initials)'); sl.onclick = slate; b.appendChild(sl);
  (i.plan || []).forEach(function (s) { b.appendChild(section(s)); });
  var l = $('list'); l.innerHTML = '';
  if (i.last.length) {
    l.appendChild(el('b', '', 'Uploaded on K' + VAN + ' (newest first)'));
    i.last.forEach(function (x) { l.appendChild(el('div', '', x.section + (x.spot ? ' (' + x.spot + ')' : '') + ': ' + mb(x.bytes) + ' in ' + secs(x.ms) + ', ' + x.at + ', ' + x.by)); });
  }
}
function slate() {
  var i = st.info, ini = String(i.who.name || '').split(/\s+/).map(function (x) { return x.charAt(0).toUpperCase(); }).join('');
  var s = $('slate'); s.innerHTML = '';
  s.appendChild(el('div', 'v', 'K' + VAN));
  s.appendChild(el('div', 'l', 'Check out ' + (i.today || '')));
  s.appendChild(el('div', 'l', 'Team member ' + ini));
  if (i.pickup && i.pickup.found) s.appendChild(el('div', 'l', 'Reservation ' + i.pickup.res));
  s.appendChild(el('div', 'x', 'Film this first. Tap anywhere to close.'));
  s.style.display = 'flex';
}
function section(s) {
  var box = el('div', 'sec' + (s.done ? ' done' : '')); box.id = 'sec_' + key(s.name);
  var unit = s.type === 'video' ? ' video' : ' photo';
  box.appendChild(el('h2', '', (s.done ? '✓ ' : '') + s.name));
  box.appendChild(el('div', 'cnt', s.have + ' of ' + s.need + unit + 's' + (s.parts.length ? '' : (s.have > s.need ? ' (more is fine)' : ''))));
  if (s.note) { var d = el('details'); d.appendChild(el('summary', '', 'How to')); d.appendChild(el('div', '', s.note)); box.appendChild(d); }
  if (s.parts.length) {
    s.parts.forEach(function (pt) {
      var row = el('div', 'part');
      row.appendChild(el('b', '', (pt.have >= pt.need ? '✓ ' : '') + pt.name + ': ' + pt.have + ' of ' + pt.need));
      row.appendChild(buttons(s, pt.name, true));
      var pr = el('div', 'prog'); pr.id = 'prog_' + key(s.name) + '_' + key(pt.name); row.appendChild(pr);
      box.appendChild(row);
    });
  } else {
    box.appendChild(buttons(s, '', false));
    var pr = el('div', 'prog'); pr.id = 'prog_' + key(s.name) + '_'; box.appendChild(pr);
  }
  if (s.type === 'video' && saved(s.name)) {
    var k = saved(s.name), cb = el('button', 'btn', 'Carry on: ' + k.name + ' (' + mb(k.size) + ')');
    cb.onclick = function () { pick('fVidRoll', s, '', true); }; box.appendChild(cb);
  }
  return box;
}
function buttons(s, spot, small) {
  var r = el('div', 'row'), cls = small ? ' small' : '';
  var a = el('button', 'btn primary' + cls, s.type === 'video' ? 'Record video' : 'Take photo'), c = el('button', 'btn' + cls, 'Camera roll');
  a.onclick = function () { pick(s.type === 'video' ? 'fVidCam' : 'fCam', s, spot); };
  c.onclick = function () { pick(s.type === 'video' ? 'fVidRoll' : 'fRoll', s, spot); };
  r.appendChild(a); r.appendChild(c); return r;
}
function pick(inputId, s, spot, resume) {
  if (st.busy) { err('Wait for the upload to finish.'); return; }
  var inp = $(inputId); inp.value = '';
  inp.onchange = function () {
    var files = Array.prototype.slice.call(inp.files || []); if (!files.length) return;
    if (s.type === 'video') runVideo(files[0], s.name, !!resume);
    else runPhotos(files, s.name, spot);
  };
  inp.click();
}

/* ---------- photos: shrink on the phone, ONE call each (speed fix, 26 Nov) ---------- */
function shrink(file) {
  return new Promise(function (ok) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, PHOTO_MAX_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { ok(b || file); }, 'image/jpeg', PHOTO_QUALITY);
    };
    img.onerror = function () { URL.revokeObjectURL(url); ok(file); };   // a format the browser cannot draw goes up as it is
    img.src = url;
  });
}
function runPhotos(files, sectionName, spot) {
  st.busy = true; err(''); var p = $('prog_' + key(sectionName) + '_' + key(spot)), done = 0, t0 = Date.now(), sent = 0;
  p.innerHTML = ''; var line = el('div', '', ''), bar = el('div', 'bar'), fill = el('i'); bar.appendChild(fill); p.appendChild(line); p.appendChild(bar);
  var next = function (k) {
    if (k >= files.length) { st.busy = false; line.textContent = done + ' of ' + files.length + ' photos saved, ' + mb(sent) + ' in ' + secs(Date.now() - t0) + '.'; setTimeout(load, 400); return; }
    line.textContent = 'Photo ' + (k + 1) + ' of ' + files.length + ': getting it ready';
    var t1 = Date.now(), size = 0;
    shrink(files[k]).then(function (blob) {
      size = blob.size;
      line.textContent = 'Photo ' + (k + 1) + ' of ' + files.length + ': uploading ' + mb(blob.size);
      return toB64(blob).then(function (b64) {
        return api('staffMediaPhoto', [st.tok, VAN, { section: sectionName, spot: spot, mime: blob.type || files[k].type || 'image/jpeg', name: files[k].name || 'photo.jpg', device: device() }, b64, { ms: Date.now() - t1 }]);
      });
    }).then(function () { done++; sent += size; fill.style.width = Math.round(done / files.length * 100) + '%'; next(k + 1); },
      function (e) { st.busy = false; err('Photo ' + (k + 1) + ' did not save: ' + e.message + ' Tap the button again to add it.'); });
  };
  next(0);
}

/* ---------- video: full quality, 4 MB pieces, carries on after a dropped signal ---------- */
function saved(sec) { try { return JSON.parse(localStorage.getItem('kmedia_up_' + VAN + '_' + key(sec)) || 'null'); } catch (e) { return null; } }
function keep(sec, o) { try { if (o) localStorage.setItem('kmedia_up_' + VAN + '_' + key(sec), JSON.stringify(o)); else localStorage.removeItem('kmedia_up_' + VAN + '_' + key(sec)); } catch (e) {} }
function runVideo(file, sectionName, resume) {
  st.busy = true; err(''); var p = $('prog_' + key(sectionName) + '_'); p.innerHTML = '';
  var line = el('div', '', 'Video ' + mb(file.size) + ': starting'), bar = el('div', 'bar'), fill = el('i'); bar.appendChild(fill); p.appendChild(line); p.appendChild(bar);
  var k = saved(sectionName), same = k && k.name === file.name && k.size === file.size;
  if (resume && !same) { st.busy = false; err('That is not the same video. Pick ' + (k ? k.name : 'the video you started') + '.'); return; }
  upload(file, { section: sectionName, mime: file.type || 'video/quicktime', name: file.name || 'video.mov' }, function (done, total, ms) {
    fill.style.width = Math.round(done / total * 100) + '%';
    var rate = ms > 0 ? (done / 1048576) / (ms / 1000) : 0;
    line.textContent = 'Video: ' + mb(done) + ' of ' + mb(total) + (rate ? ', ' + rate.toFixed(1) + ' MB/s' : '');
  }, same ? k : null).then(function (r) {
    keep(sectionName, null); st.busy = false; line.textContent = 'Video saved: ' + mb(r.size) + ' in ' + secs(r.ms) + '.'; setTimeout(load, 400);
  }, function (e) { st.busy = false; err('The video stopped: ' + e.message + ' Tap Carry on and pick the same video.'); render(); });
}

/* one video: start (or carry on), then pieces until Drive says done */
function upload(blob, meta, onProg, carry) {
  var size = blob.size, t0 = Date.now() - (carry && carry.ms ? carry.ms : 0), job;
  var go = function (offset) {
    if (offset >= size) return Promise.reject(new Error('Upload ended early.'));
    var end = Math.min(offset + job.chunk, size);
    return toB64(blob.slice(offset, end)).then(function (b64) {
      return api('staffMediaChunk', [st.tok, job.id, b64, offset, { ms: Date.now() - t0 }]);
    }).then(function (r) {
      if (r.done) return { size: size, ms: Date.now() - t0 };
      keep(meta.section, { id: job.id, chunk: job.chunk, name: blob.name, size: size, ms: Date.now() - t0 });
      onProg(r.next, size, Date.now() - t0);
      return go(r.next);
    });
  };
  if (carry) {
    job = { id: carry.id, chunk: carry.chunk };
    return api('staffMediaResume', [st.tok, job.id]).then(function (r) { return r.done ? { size: size, ms: Date.now() - t0 } : (onProg(r.next, size, Date.now() - t0), go(r.next)); });
  }
  return api('staffMediaStart', [st.tok, VAN, { section: meta.section, mime: meta.mime, size: size, name: meta.name, device: device() }]).then(function (s) {
    job = { id: s.id, chunk: s.chunk };
    keep(meta.section, { id: job.id, chunk: job.chunk, name: blob.name, size: size, ms: 0 });
    return go(0);
  });
}
function toB64(b) { return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(',')[1] || ''); }; r.onerror = function () { no(new Error('Could not read the file.')); }; r.readAsDataURL(b); }); }

/* ---------- mock (layout check, nothing sent) ---------- */
var MK_PLAN = [['Roof', 'photo', 8], ['Exterior', 'photo', 0, [['Windshield', 3], ['Front', 3], ['Driver side', 4], ['Rear', 3], ['Passenger side', 4]]],
  ['Bumper corners', 'photo', 0, [['Front left', 1], ['Front right', 1], ['Rear left', 1], ['Rear right', 1]]], ['Cargo', 'photo', 3], ['Dash', 'photo', 1],
  ['VCR pages', 'photo', 0, [['VCR page 1', 1], ['VCR page 2', 1], ['VCR page 3', 1]]], ['Exterior video', 'video', 1], ['Interior video', 'video', 1]];
var mk = { rows: [], last: [], up: {} };
function mkPlan() {
  var out = MK_PLAN.map(function (p) {
    var rs = mk.rows.filter(function (r) { return r.section === p[0]; }), parts = (p[3] || []).map(function (z) { return { name: z[0], need: z[1], have: rs.filter(function (r) { return r.spot === z[0]; }).length }; });
    var need = parts.length ? parts.reduce(function (a, x) { return a + x.need; }, 0) : p[2];
    var done = parts.length ? parts.every(function (x) { return x.have >= x.need; }) : rs.length >= p[2];
    return { name: p[0], type: p[1], need: need, have: rs.length, done: done, parts: parts, note: 'Mock note for ' + p[0] + '.' };
  });
  return out;
}
function mockApi(fn, a) {
  return new Promise(function (ok, no) { setTimeout(function () {
    if (fn === 'staffMediaInfo') { var pl = mkPlan(); return ok({ ok: true, who: { name: 'Test Person', role: 'Owner', lead: true }, van: VAN, open: VAN === '999', plan: pl,
      doneCount: pl.filter(function (s) { return s.done; }).length, total: 8, last: mk.last, chunk: 4194304, today: '2026-11-26',
      pickup: { found: true, res: '999001', ok: false, text: 'Pickup 2026-11-30 12:00 (reservation 999001): in 86 hours. Too early: photos must be within 48 hours of pickup.' } }); }
    if (fn === 'staffMediaPhoto') { var m = a[2], n = Math.round(a[3].length * 3 / 4); mk.rows.push({ section: m.section, spot: m.spot }); mk.last.unshift({ section: m.section, spot: m.spot, bytes: n, ms: 300, at: 'now', by: 'Test' }); return ok({ ok: true, done: true, captureId: 'MC-MOCK' }); }
    if (fn === 'staffMediaStart') { var id = 'MU-' + Date.now(); mk.up[id] = a[2]; return ok({ ok: true, id: id, chunk: 4194304 }); }
    if (fn === 'staffMediaChunk') { var u = mk.up[a[1]], nx = a[3] + Math.round(a[2].length * 3 / 4); if (nx >= u.size) { mk.rows.push({ section: u.section, spot: '' }); mk.last.unshift({ section: u.section, bytes: u.size, ms: a[4].ms, at: 'now', by: 'Test' }); return ok({ ok: true, done: true }); } return ok({ ok: true, done: false, next: nx }); }
    if (fn === 'staffMediaResume') return ok({ ok: true, done: false, next: 0 });
    no(new Error('mock: unknown ' + fn));
  }, 120); });
}

if (!VAN) { $('body').appendChild(el('p', '', 'No van number. Open this page from Karma Ops or add ?van= and the number.')); }
else { st.tok = getTok(); if (st.tok) load(); else signIn(); }
</script>
</body>
</html>
